name: Node.js CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server - Node 18
            node-version: '18.x'
            app-dir: ./server
            cache-dependency-path: server/package-lock.json
            test-command: ''
            build-command: npm run build --if-present
          - name: Server - Node 20
            node-version: '20.x'
            app-dir: ./server
            cache-dependency-path: server/package-lock.json
            test-command: ''
            build-command: npm run build --if-present
          - name: Client - Node 18
            node-version: '18.x'
            app-dir: ./client
            cache-dependency-path: client/package-lock.json
            test-command: npm test -- --watchAll=false
            build-command: npm run build
          - name: Client - Node 20
            node-version: '20.x'
            app-dir: ./client
            cache-dependency-path: client/package-lock.json
            test-command: npm test -- --watchAll=false
            build-command: npm run build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.cache-dependency-path }}
      - name: Install dependencies
        working-directory: ${{ matrix.app-dir }}
        run: npm ci
      - name: Run tests
        if: ${{ matrix.test-command != '' }}
        working-directory: ${{ matrix.app-dir }}
        run: ${{ matrix.test-command }}
      - name: Build app
        working-directory: ${{ matrix.app-dir }}
        run: ${{ matrix.build-command }}

