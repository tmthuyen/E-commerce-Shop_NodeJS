services:
  mongo:
    image: mongo:8.0
    container_name: ecm-nodejs-mongo
    ports:
      - "27018:${DB_PORT}"
    volumes:
      - mongo_data:/data/db

  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
  #   container_name: elasticsearch
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #   ports:
  #     - "9200:9200"
  #   volumes:
  #     - esdata:/usr/share/elasticsearch/data
    
  # thư mục gốc chưa server, client, docker (docker-compose.yml, Dockerfile.client, Dockerfile.server)
  server: 
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      target: dev  
    image: ecm-nodejs-server:dev
    container_name: ecm-nodejs-server
    ports:
      - "8080:${BACKEND_PORT}"
    volumes:
      - ../server:/app 
      - /app/node_modules   
    environment: 
      - NODE_ENV=development 
      - PORT=${BACKEND_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      # - DB_USER=${DB_USER:-root}
      # - DB_HOST=${DB_HOST:-mongo}
      # - DB_PORT=${DB_PORT:-27017}
      # - DB_NAME=e_commerce_final_dev
      - MONGO_URI=${MONGO_URI}
      - ELASTIC_URL=http://elasticsearch:9200
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on: [mongo]


  client:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev 
    image: ecm-nodejs-web:dev
    container_name: ecm-nodejs-web
    ports:
      - "4000:${FRONTEND_PORT}"
    volumes:
      - ../web:/app 
      - /app/node_modules 
    environment:
      - NODE_ENV=development 
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_INTERVAL=1000
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
      - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID}
    depends_on:
      - server

volumes:
  mongo_data:
  # esdata:
  
